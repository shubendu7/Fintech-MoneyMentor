<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Couple's Money Planner — AI Money Mentor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #c9a84c; --teal: #2dd4a8; --pink: #f472b6; --dark: #0a0a0f;
            --text: #f0f0f0; --muted: rgba(240,240,240,0.5); --border: rgba(255,255,255,0.08);
            --danger: #f87171;
        }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }
        .grid-overlay {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 48px 48px; z-index: 0; pointer-events: none;
        }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 40px; background: rgba(10,10,15,0.88);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(14px);
        }
        .logo { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #fff; text-decoration: none; }
        .logo span { color: var(--gold); }
        .back-link { font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: var(--gold); }

        main { max-width: 1000px; margin: 0 auto; padding: 48px 32px 80px; position: relative; z-index: 1; }

        .page-header { margin-bottom: 32px; }
        .page-eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--pink); font-weight: 600; margin-bottom: 10px; }
        .page-title { font-size: clamp(24px, 3.5vw, 32px); font-weight: 700; color: #fff; }
        .page-sub { font-size: 14px; color: var(--muted); margin-top: 8px; }

        .panel { background: rgba(20,20,28,0.8); border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 20px; }
        .panel h2 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 18px; }

        .partners-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 700px) { .partners-grid { grid-template-columns: 1fr; } }

        .partner-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
        .partner-box h3 { font-size: 13px; font-weight: 700; color: var(--pink); margin-bottom: 14px; }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 11px; color: rgba(255,255,255,0.55); margin-bottom: 4px; font-weight: 500; }
        .field input {
            width: 100%; padding: 9px 11px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #fff;
            font-size: 12.5px; font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .field input:focus { border-color: rgba(244,114,182,0.55); }

        .shared-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        @media (max-width: 700px) { .shared-grid { grid-template-columns: 1fr 1fr; } }

        .submit-btn {
            width: 100%; background: var(--pink); color: #000; font-weight: 700; font-size: 14px;
            padding: 13px 0; border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
            transition: opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.88; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner {
            width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #000;
            border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
        }
        .submit-btn.loading .spinner { display: inline-block; }
        .submit-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .msg-box {
            display: none; font-size: 12.5px; padding: 10px 14px; border-radius: 8px;
            margin-bottom: 16px; line-height: 1.5;
        }
        .msg-box.error { display: block; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }

        .result-panel { display: none; }
        .result-panel.visible { display: block; }

        .health-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 20px; margin-bottom: 20px;
        }
        .health-strong { background: rgba(45,212,168,0.1); border: 1px solid rgba(45,212,168,0.3); color: var(--teal); }
        .health-moderate { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); }
        .health-needs_attention { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        @media (max-width: 700px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
        .stat-chip { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
        .stat-chip .label { font-size: 10px; color: rgba(255,255,255,0.45); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-chip .val { font-size: 16px; font-weight: 700; color: #fff; }

        .recs-list { list-style: none; }
        .recs-list li {
            font-size: 12.5px; color: rgba(255,255,255,0.75); line-height: 1.6;
            padding: 9px 0 9px 18px; position: relative; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .recs-list li::before { content: '→'; position: absolute; left: 0; color: var(--pink); }
    </style>
</head>
<body>

<div class="grid-overlay"></div>

<nav>
    <a href="dashboard.html" class="logo"><span>AI</span> MONEY MENTOR</a>
    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
</nav>

<main>
    <div class="page-header">
        <div class="page-eyebrow">COUPLE'S MONEY PLANNER</div>
        <h1 class="page-title">Joint financial planning made simple.</h1>
        <p class="page-sub">Combine both incomes and expenses to see your household's true financial picture.</p>
    </div>

    <div class="panel">
        <h2>Household Details</h2>
        <div id="msgBox" class="msg-box"></div>
        <form id="coupleForm">
            <div class="partners-grid">
                <div class="partner-box">
                    <h3>Partner 1</h3>
                    <div class="field"><label>Annual Income (Rs)</label><input type="number" id="p1Income" placeholder="900000" value="0" /></div>
                    <div class="field"><label>Monthly Expenses (Rs)</label><input type="number" id="p1Expenses" placeholder="20000" value="0" /></div>
                    <div class="field"><label>Current Savings (Rs)</label><input type="number" id="p1Savings" placeholder="150000" value="0" /></div>
                    <div class="field"><label>Investments (Rs)</label><input type="number" id="p1Investments" placeholder="100000" value="0" /></div>
                    <div class="field"><label>Debt (Rs)</label><input type="number" id="p1Debt" placeholder="0" value="0" /></div>
                </div>
                <div class="partner-box">
                    <h3>Partner 2</h3>
                    <div class="field"><label>Annual Income (Rs)</label><input type="number" id="p2Income" placeholder="700000" value="0" /></div>
                    <div class="field"><label>Monthly Expenses (Rs)</label><input type="number" id="p2Expenses" placeholder="15000" value="0" /></div>
                    <div class="field"><label>Current Savings (Rs)</label><input type="number" id="p2Savings" placeholder="100000" value="0" /></div>
                    <div class="field"><label>Investments (Rs)</label><input type="number" id="p2Investments" placeholder="80000" value="0" /></div>
                    <div class="field"><label>Debt (Rs)</label><input type="number" id="p2Debt" placeholder="0" value="0" /></div>
                </div>
            </div>

            <h3 style="font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:10px;">Shared Household Items</h3>
            <div class="shared-grid" style="margin-bottom:18px;">
                <div class="field"><label>Shared Expenses (Rs)</label><input type="number" id="sharedExpenses" placeholder="15000" value="0" /></div>
                <div class="field"><label>Shared Savings (Rs)</label><input type="number" id="sharedSavings" placeholder="50000" value="0" /></div>
                <div class="field"><label>Shared Investments (Rs)</label><input type="number" id="sharedInvestments" placeholder="0" value="0" /></div>
                <div class="field"><label>Shared Debt (Rs)</label><input type="number" id="sharedDebt" placeholder="0" value="0" /></div>
            </div>

            <button type="submit" class="submit-btn" id="coupleBtn">
                <span class="spinner"></span>
                <span class="btn-text">Generate Household Plan</span>
            </button>
        </form>
    </div>

    <div class="panel result-panel" id="resultPanel">
        <h2>Your Household Financial Plan</h2>
        <div class="health-badge" id="healthBadge"></div>
        <div class="stats-grid" id="statsGrid"></div>
        <h3 style="font-size:12px;color:var(--pink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Recommendations</h3>
        <ul class="recs-list" id="recsList"></ul>
    </div>
</main>

<script>
    const API_BASE = 'http://localhost:5000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const msgBox = document.getElementById('msgBox');
    function clearMsg() { msgBox.className = 'msg-box'; msgBox.textContent = ''; }
    function showMsg(text) { msgBox.className = 'msg-box error'; msgBox.textContent = text; }
    function fmt(num) { return 'Rs ' + Number(num || 0).toLocaleString('en-IN'); }
    function val(id) { return Number(document.getElementById(id).value) || 0; }

    document.getElementById('coupleForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearMsg();
        const btn = document.getElementById('coupleBtn');
        btn.disabled = true;
        btn.classList.add('loading');

        const payload = {
            partner1: {
                annual_income: val('p1Income'),
                monthly_expenses: val('p1Expenses'),
                current_savings: val('p1Savings'),
                investments: val('p1Investments'),
                debt: val('p1Debt')
            },
            partner2: {
                annual_income: val('p2Income'),
                monthly_expenses: val('p2Expenses'),
                current_savings: val('p2Savings'),
                investments: val('p2Investments'),
                debt: val('p2Debt')
            },
            shared_expenses: val('sharedExpenses'),
            shared_savings: val('sharedSavings'),
            shared_investments: val('sharedInvestments'),
            shared_debt: val('sharedDebt'),
            goals: []
        };

        try {
            const res = await fetch(API_BASE + '/api/couple-money/planner', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(payload)
            });

            if (res.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            const data = await res.json();

            if (!res.ok) {
                showMsg(data.message || 'Something went wrong. Please try again.');
                return;
            }

            const plan = data.plan;
            const cf = plan.combined_financials;

            const badge = document.getElementById('healthBadge');
            badge.className = 'health-badge health-' + plan.financial_health;
            const healthLabels = { strong: 'Strong', moderate: 'Moderate', needs_attention: 'Needs Attention' };
            badge.textContent = '\u2713 Household Financial Health: ' + (healthLabels[plan.financial_health] || plan.financial_health);

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '';
            const stats = [
                ['Combined Annual Income', fmt(cf.annual_income)],
                ['Combined Monthly Expenses', fmt(cf.monthly_expenses)],
                ['Annual Surplus', fmt(cf.annual_surplus)],
                ['Savings Rate', cf.savings_rate_percent + '%'],
                ['Emergency Fund Gap', fmt(plan.emergency_fund.gap)],
                ['Suggested Monthly Investment', fmt(plan.investment_plan.suggested_monthly_investment)]
            ];
            stats.forEach(function(s) {
                const div = document.createElement('div');
                div.className = 'stat-chip';
                div.innerHTML = '<div class="label">' + s[0] + '</div><div class="val">' + s[1] + '</div>';
                statsGrid.appendChild(div);
            });

            const recsList = document.getElementById('recsList');
            recsList.innerHTML = '';
            (plan.recommendations || []).forEach(function(r) {
                const li = document.createElement('li');
                li.textContent = r;
                recsList.appendChild(li);
            });

            document.getElementById('resultPanel').classList.add('visible');

        } catch (err) {
            showMsg('Could not reach the server. Is the backend running?');
        } finally {
            btn.disabled = false;
            btn.classList.remove('loading');
        }
    });
</script>
</body>
</html>
