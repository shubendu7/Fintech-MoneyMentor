<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Assistant — AI Money Mentor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #c9a84c; --teal: #2dd4a8; --dark: #0a0a0f;
            --text: #f0f0f0; --muted: rgba(240,240,240,0.5); --border: rgba(255,255,255,0.08);
            --danger: #f87171;
        }
        html, body { height: 100%; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--dark); color: var(--text); display: flex; flex-direction: column; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 40px; background: rgba(10,10,15,0.92);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
            backdrop-filter: blur(14px);
        }
        .logo { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #fff; text-decoration: none; }
        .logo span { color: var(--gold); }
        .back-link { font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: var(--gold); }

        .chat-shell {
            flex: 1; display: flex; flex-direction: column;
            max-width: 780px; width: 100%; margin: 0 auto; padding: 0 20px;
            overflow: hidden;
        }

        .chat-header { padding: 20px 0 12px; }
        .chat-eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--teal); font-weight: 600; margin-bottom: 6px; }
        .chat-title { font-size: 20px; font-weight: 700; color: #fff; }

        .messages {
            flex: 1; overflow-y: auto; padding: 12px 0 20px;
            display: flex; flex-direction: column; gap: 14px;
        }

        .msg-row { display: flex; gap: 10px; max-width: 85%; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.assistant { align-self: flex-start; }

        .msg-avatar {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }
        .msg-row.user .msg-avatar { background: var(--gold); color: #000; }
        .msg-row.assistant .msg-avatar { background: rgba(45,212,168,0.15); color: var(--teal); border: 1px solid rgba(45,212,168,0.3); }

        .msg-bubble {
            padding: 12px 16px; border-radius: 14px; font-size: 13.5px; line-height: 1.6;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .msg-row.user .msg-bubble { background: var(--gold); color: #000; border-bottom-right-radius: 4px; }
        .msg-row.assistant .msg-bubble { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }

        .file-chip {
            display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
            background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 12px; margin-bottom: 6px;
        }
        .msg-row.assistant .file-chip { background: rgba(255,255,255,0.06); }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dot {
            width: 6px; height: 6px; background: var(--teal); border-radius: 50%;
            animation: typingBounce 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-4px);opacity:1} }

        .empty-state {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: rgba(255,255,255,0.3); font-size: 13px; gap: 8px;
        }
        .empty-state .icon { font-size: 36px; opacity: 0.5; }

        .composer { border-top: 1px solid var(--border); padding: 14px 0 20px; flex-shrink: 0; }
        .file-preview {
            display: none; align-items: center; gap: 8px; font-size: 12px;
            background: rgba(45,212,168,0.08); border: 1px solid rgba(45,212,168,0.25);
            color: var(--teal); padding: 7px 12px; border-radius: 8px; margin-bottom: 10px; width: fit-content;
        }
        .file-preview.visible { display: flex; }
        .file-preview .remove-file { cursor: pointer; font-weight: 700; color: rgba(255,255,255,0.5); }
        .file-preview .remove-file:hover { color: var(--danger); }

        .composer-row { display: flex; gap: 10px; align-items: flex-end; }
        .attach-btn {
            width: 42px; height: 42px; flex-shrink: 0; border-radius: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.6); cursor: pointer; font-size: 17px;
            display: flex; align-items: center; justify-content: center; transition: border-color 0.2s;
        }
        .attach-btn:hover { border-color: rgba(45,212,168,0.4); color: var(--teal); }

        .composer textarea {
            flex: 1; resize: none; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
            color: #fff; font-size: 14px; font-family: inherit; padding: 11px 14px;
            outline: none; max-height: 120px; transition: border-color 0.2s;
        }
        .composer textarea:focus { border-color: rgba(45,212,168,0.5); }

        .send-btn {
            width: 42px; height: 42px; flex-shrink: 0; border-radius: 10px;
            background: var(--teal); border: none; color: #000; cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        .send-btn:hover:not(:disabled) { opacity: 0.85; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .msg-box {
            display: none; font-size: 12px; padding: 8px 12px; border-radius: 7px;
            margin-bottom: 10px; background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3); color: var(--danger);
        }
        .msg-box.visible { display: block; }
    </style>
</head>
<body>

<nav>
    <a href="dashboard.html" class="logo"><span>AI</span> MONEY MENTOR</a>
    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
</nav>

<div class="chat-shell">
    <div class="chat-header">
        <div class="chat-eyebrow">AI ASSISTANT</div>
        <div class="chat-title">Ask anything about your finances</div>
    </div>

    <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
            <div class="icon">&#128172;</div>
            <div>Ask a question or upload a document<br/>(PDF, Form 16, bank statement) to get started.</div>
        </div>
    </div>

    <div class="composer">
        <div class="msg-box" id="msgBox"></div>
        <div class="file-preview" id="filePreview">
            <span>&#128206;</span>
            <span id="fileName"></span>
            <span class="remove-file" id="removeFile">&times;</span>
        </div>
        <div class="composer-row">
            <button class="attach-btn" id="attachBtn" title="Attach a file">&#128206;</button>
            <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.csv,.xlsx" style="display:none;" />
            <textarea id="messageInput" rows="1" placeholder="Type your message..."></textarea>
            <button class="send-btn" id="sendBtn">&#10148;</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:5000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const filePreview = document.getElementById('filePreview');
    const fileNameEl = document.getElementById('fileName');
    const removeFileBtn = document.getElementById('removeFile');
    const msgBox = document.getElementById('msgBox');

    let selectedFile = null;

    function showError(text) {
        msgBox.textContent = text;
        msgBox.classList.add('visible');
        setTimeout(function() { msgBox.classList.remove('visible'); }, 4000);
    }

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function addMessage(role, text, fileLabel) {
        emptyState.style.display = 'none';
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        let html = '';
        if (fileLabel) {
            html += '<div class="file-chip">&#128206; ' + escapeHtml(fileLabel) + '</div><br/>';
        }
        html += escapeHtml(text).replace(/\n/g, '<br/>');
        bubble.innerHTML = html;

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
    }

    function addTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'msg-row assistant';
        row.id = 'typingRow';

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.innerHTML = '<div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const row = document.getElementById('typingRow');
        if (row) row.remove();
    }

    attachBtn.addEventListener('click', function() { fileInput.click(); });

    fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            fileNameEl.textContent = selectedFile.name;
            filePreview.classList.add('visible');
        }
    });

    removeFileBtn.addEventListener('click', function() {
        selectedFile = null;
        fileInput.value = '';
        filePreview.classList.remove('visible');
    });

    messageInput.addEventListener('input', function() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text && !selectedFile) return;

        const fileLabel = selectedFile ? selectedFile.name : null;
        addMessage('user', text || 'Summarize this document', fileLabel);

        const formData = new FormData();
        formData.append('message', text || 'Please summarize this document.');
        if (selectedFile) formData.append('file', selectedFile);

        messageInput.value = '';
        messageInput.style.height = 'auto';
        sendBtn.disabled = true;
        selectedFile = null;
        fileInput.value = '';
        filePreview.classList.remove('visible');

        addTypingIndicator();

        try {
            const res = await fetch(API_BASE + '/api/chat/message', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });

            removeTypingIndicator();

            if (res.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            const data = await res.json();

            if (!res.ok) {
                showError(data.message || 'Something went wrong. Please try again.');
                return;
            }

            addMessage('assistant', data.reply);

        } catch (err) {
            removeTypingIndicator();
            showError('Could not reach the server. Is the backend running?');
        } finally {
            sendBtn.disabled = false;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(API_BASE + '/api/chat/history', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            const data = await res.json();
            if (data.history && data.history.length > 0) {
                emptyState.style.display = 'none';
                data.history.forEach(function(msg) {
                    addMessage(msg.role, msg.message);
                });
            }
        } catch (err) {
            console.error('Failed to load chat history:', err);
        }
    }

    loadHistory();
</script>
</body>
</html>
