<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — AI Money Mentor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #c9a84c;
            --teal: #2dd4a8;
            --dark: #0a0a0f;
            --dark3: #111118;
            --card-bg: #14141c;
            --text: #f0f0f0;
            --muted: rgba(240,240,240,0.5);
            --border: rgba(255,255,255,0.08);
            --danger: #f87171;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(201,168,76,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: 0;
        }

        .back-home {
            position: fixed;
            top: 24px;
            left: 24px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
            z-index: 2;
        }
        .back-home:hover { color: var(--gold); }

        .auth-wrap {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .logo-row { text-align: center; margin-bottom: 32px; }
        .logo-row .logo { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #fff; }
        .logo-row .logo span { color: var(--gold); }
        .logo-dot { display: inline-block; width: 6px; height: 6px; background: var(--teal); border-radius: 50%; margin-left: 4px; vertical-align: middle; }

        .auth-card {
            background: rgba(20,20,28,0.85);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            backdrop-filter: blur(14px);
        }

        .auth-tabs {
            display: flex;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 9px 0;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            background: none;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s, background 0.2s;
        }
        .auth-tab.active { background: var(--gold); color: #000; }

        h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .auth-sub { font-size: 13px; color: var(--muted); margin-bottom: 26px; line-height: 1.5; }

        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 6px; font-weight: 500; }
        .field input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .field input:focus { border-color: rgba(201,168,76,0.55); background: rgba(255,255,255,0.07); }
        .field input::placeholder { color: rgba(255,255,255,0.25); }

        .submit-btn {
            width: 100%;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 14px;
            padding: 13px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        .submit-btn.loading .spinner { display: inline-block; }
        .submit-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .msg-box {
            display: none;
            font-size: 12.5px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .msg-box.error { display: block; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
        .msg-box.success { display: block; background: rgba(45,212,168,0.1); border: 1px solid rgba(45,212,168,0.3); color: var(--teal); }

        .auth-footer { text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 22px; }
    </style>
</head>
<body>

<div class="grid-overlay"></div>
<a href="index.html" class="back-home">&larr; Back to home</a>

<div class="auth-wrap">
    <div class="logo-row">
        <div class="logo"><span>AI</span> MONEY MENTOR <span class="logo-dot"></span></div>
    </div>

    <div class="auth-card">
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin">Log In</button>
            <button class="auth-tab" id="tabSignup">Sign Up</button>
        </div>

        <div id="msgBox" class="msg-box"></div>

        <div class="form-panel active" id="loginPanel">
            <h1>Welcome back</h1>
            <p class="auth-sub">Log in to access your financial dashboard.</p>
            <form id="loginForm">
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="********" required />
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Log In</span>
                </button>
            </form>
        </div>

        <div class="form-panel" id="signupPanel">
            <h1>Create your account</h1>
            <p class="auth-sub">Start your journey to smarter money management.</p>
            <form id="signupForm">
                <div class="field">
                    <label for="signupName">Full name</label>
                    <input type="text" id="signupName" placeholder="Your full name" required />
                </div>
                <div class="field">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="At least 8 characters" required minlength="8" />
                </div>
                <div class="field">
                    <label for="signupPhone">Phone (optional)</label>
                    <input type="tel" id="signupPhone" placeholder="9876543210" />
                </div>
                <button type="submit" class="submit-btn" id="signupBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
        </div>

        <p class="auth-footer">Protected by JWT authentication &amp; encrypted passwords.</p>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:5000';

    const tabLogin    = document.getElementById('tabLogin');
    const tabSignup    = document.getElementById('tabSignup');
    const loginPanel   = document.getElementById('loginPanel');
    const signupPanel  = document.getElementById('signupPanel');
    const msgBox       = document.getElementById('msgBox');

    function clearMsg() { msgBox.className = 'msg-box'; msgBox.textContent = ''; }
    function showMsg(text, type) { msgBox.className = 'msg-box ' + type; msgBox.textContent = text; }

    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        loginPanel.classList.add('active');
        signupPanel.classList.remove('active');
        clearMsg();
    });
    tabSignup.addEventListener('click', () => {
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        signupPanel.classList.add('active');
        loginPanel.classList.remove('active');
        clearMsg();
    });

    function setLoading(btn, isLoading) {
        btn.disabled = isLoading;
        btn.classList.toggle('loading', isLoading);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg();
        const btn = document.getElementById('loginBtn');
        setLoading(btn, true);

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok) {
                showMsg(data.message || 'Login failed. Please check your credentials.', 'error');
                return;
            }

            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            showMsg('Login successful! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);

        } catch (err) {
            showMsg('Could not reach the server. Is the backend running?', 'error');
        } finally {
            setLoading(btn, false);
        }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg();
        const btn = document.getElementById('signupBtn');
        setLoading(btn, true);

        const full_name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const phone = document.getElementById('signupPhone').value.trim();

        try {
            const res = await fetch(`${API_BASE}/api/auth/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, email, password, phone })
            });
            const data = await res.json();

            if (!res.ok) {
                showMsg(data.message || 'Signup failed. Please try again.', 'error');
                return;
            }

            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            showMsg('Account created! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);

        } catch (err) {
            showMsg('Could not reach the server. Is the backend running?', 'error');
        } finally {
            setLoading(btn, false);
        }
    });
</script>
</body>
</html>
